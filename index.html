<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treino Semanal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header-nav">
    <nav id="menuDias" class="tabs-dias"></nav>
  </header>

  <main class="main-container">
    <div class="progresso-wrapper">
      <div class="progresso-info">
        <span id="progressoTexto">0 de 0 concluídos</span>
        <span id="progressoPorcentagem">0%</span>
      </div>
      <div class="barra-container">
        <div id="barraProgresso" class="barra-progresso"></div>
      </div>
    </div>

    <div id="exercicios" class="exercicios-lista"></div>
  </main>

  <script src="treino.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker registrado com sucesso!'))
        .catch(err => console.log('Falha ao registrar Service Worker:', err));
    }
  </script>
</body>
</html>
